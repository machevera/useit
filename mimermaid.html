<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiMermaid — Editor de Diagramas</title>

<!-- ✅ CDN oficial de Mermaid (jsDelivr) — versión 11.15.0 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════
   TOKENS — LIGHT
═══════════════════════════════════════ */
:root {
  --bg:           #F4F5F7;
  --surface:      #FFFFFF;
  --surface-alt:  #F0F1F4;
  --border:       #D8DAE0;
  --border-strong:#B4B8C4;
  --text:         #1A1D23;
  --text-2:       #4A5060;
  --text-3:       #8891A4;
  --accent:       #1B4FD8;
  --accent-hover: #1540B8;
  --accent-light: #E8EDFB;
  --success:      #0D7A5F;
  --success-bg:   #E6F5F1;
  --warn:         #B85000;
  --warn-bg:      #FEF0E6;
  --editor-bg:    #FAFBFC;
  --shadow-sm:    0 1px 3px rgba(0,0,0,.07);
  --radius:       6px;
  --radius-lg:    10px;
}

/* ── DARK ─────────────────────────────── */
.dark {
  --bg:           #0E1117;
  --surface:      #161B27;
  --surface-alt:  #1E2434;
  --border:       #2C3347;
  --border-strong:#3D4560;
  --text:         #E4E8F0;
  --text-2:       #96A0B8;
  --text-3:       #5C6680;
  --accent:       #4A80F0;
  --accent-hover: #6494F5;
  --accent-light: #1A2848;
  --success:      #2DB891;
  --success-bg:   #0D2A22;
  --warn:         #F08040;
  --warn-bg:      #2A1A0A;
  --editor-bg:    #10141E;
  --shadow-sm:    0 1px 3px rgba(0,0,0,.3);
}

/* ═══════════════════════════════════════
   BASE
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  transition: background .25s, color .25s;
  overflow: hidden;
}
button { cursor: pointer; font-family: inherit; }
select { font-family: inherit; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── TOP BAR ─────────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 16px;
  gap: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
  z-index: 10;
}

.brand { display: flex; align-items: baseline; gap: 6px; margin-right: 6px; }
.brand-name {
  font-family: 'IBM Plex Serif', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -.3px;
}
.brand-ver {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: .5px;
  text-transform: uppercase;
}
.divider-v { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

#templateSelect {
  height: 32px;
  padding: 0 10px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
  cursor: pointer;
  transition: border-color .15s;
}
#templateSelect:hover { border-color: var(--accent); }
#templateSelect:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

.spacer { flex: 1; }

.ibtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text-2);
  white-space: nowrap;
  transition: all .15s;
}
.ibtn:hover { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.ibtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ibtn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* dropdown */
.dd-wrap { position: relative; }
.dd-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 195px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 6px 24px rgba(0,0,0,.12);
  overflow: hidden;
  z-index: 200;
  display: none;
  animation: ddIn .12s ease;
}
.dd-menu.open { display: block; }
@keyframes ddIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.dd-group-label {
  padding: 8px 14px 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--text-3);
}
.dd-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  font-size: 13px;
  color: var(--text-2);
  transition: background .1s, color .1s;
  cursor: pointer;
}
.dd-item:hover { background: var(--surface-alt); color: var(--text); }
.dd-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* ═══════════════════════════════════════
   WORKSPACE
═══════════════════════════════════════ */
#workspace { display: flex; flex: 1; overflow: hidden; }

/* ── EDITOR PANE ─────────────────────── */
#editor-pane {
  width: 42%;
  min-width: 240px;
  max-width: 70%;
  display: flex;
  flex-direction: column;
  background: var(--editor-bg);
  border-right: 1px solid var(--border);
  transition: background .25s;
}

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.pane-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--text-3);
}
.pane-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 100px;
}
.badge-mono  { background: var(--accent-light); color: var(--accent); }
.badge-live  { background: var(--success-bg);   color: var(--success); }

#editor {
  flex: 1;
  background: transparent;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  line-height: 1.75;
  padding: 16px 18px;
  border: none;
  outline: none;
  resize: none;
  tab-size: 2;
  transition: color .25s;
}
#editor::placeholder { color: var(--text-3); font-style: italic; }

/* ── RESIZER ─────────────────────────── */
#resizer {
  width: 4px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background .15s;
  position: relative;
}
#resizer::after { content: ''; position: absolute; inset: 0 -4px; }
#resizer:hover, #resizer.active { background: var(--accent); }

/* ── PREVIEW PANE ────────────────────── */
#preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  transition: background .25s;
}

#canvas {
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  position: relative;
}

/* subtle dot grid background */
#canvas::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: .5;
  pointer-events: none;
  z-index: 0;
}

#diagram-output {
  position: relative;
  z-index: 1;
  transition: transform .2s ease;
  transform-origin: center center;
}

/* ✅ SVG: sin sombra, borde gris sutil profesional */
#diagram-output svg {
  max-width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

/* empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--text-3);
  font-size: 13px;
  position: relative;
  z-index: 1;
  text-align: center;
}
.empty-icon {
  width: 56px; height: 56px;
  border: 2px dashed var(--border-strong);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--border-strong);
}

/* error box */
.err-box {
  max-width: 480px;
  background: var(--warn-bg);
  border: 1px solid var(--warn);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--warn);
  position: relative;
  z-index: 1;
}
.err-box strong {
  display: block;
  font-size: 10.5px;
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 8px;
  opacity: .75;
}

/* zoom bar */
#zoom-bar {
  position: absolute;
  bottom: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 2px;
  z-index: 10;
}
.z-btn {
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  border-radius: 4px;
  color: var(--text-2);
  font-size: 15px;
  font-weight: 600;
  transition: background .1s, color .1s;
}
.z-btn:hover { background: var(--surface-alt); color: var(--accent); }
#zoom-label {
  padding: 0 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
  min-width: 44px;
  text-align: center;
  user-select: none;
}

/* ── STATUS BAR ─────────────────────── */
#statusbar {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 28px;
  padding: 0 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-3);
  flex-shrink: 0;
}
.s-ind { display: flex; align-items: center; gap: 6px; }
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: hb 2.5s infinite;
}
.dot.err  { background: var(--warn); animation: none; }
.dot.idle { background: var(--text-3); animation: none; }
@keyframes hb {
  0%,100% { opacity: 1; }
  50%      { opacity: .35; }
}
#status-msg { font-weight: 500; color: var(--text-2); }
.sb-r { margin-left: auto; }
#char-count { font-family: 'IBM Plex Mono', monospace; }

/* ── TOAST ──────────────────────────── */
#toast {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 18px;
  border-radius: 100px;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
  z-index: 9999;
  pointer-events: none;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  opacity: 0;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── RESPONSIVE ─────────────────────── */
@media (max-width: 680px) {
  #workspace { flex-direction: column; }
  #editor-pane { width: 100% !important; max-width: 100%; height: 45%; border-right: none; border-bottom: 1px solid var(--border); }
  #resizer { display: none; }
  .ibtn span { display: none; }
  .ibtn { padding: 0 8px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-name">MiMermaid</span>
      <span class="brand-ver">v3 · 11.15</span>
    </div>
    <div class="divider-v"></div>

    <select id="templateSelect" title="Cargar plantilla">
      <option value="">Plantillas…</option>
      <optgroup label="Flujo">
        <option value="flowchart">Flowchart</option>
        <option value="sequence">Secuencia</option>
        <option value="stateDiagram">Estado</option>
      </optgroup>
      <optgroup label="Datos">
        <option value="classDiagram">Clases</option>
        <option value="erDiagram">Modelo ER</option>
      </optgroup>
      <optgroup label="Gestión">
        <option value="gantt">Gantt</option>
        <option value="journey">User Journey</option>
        <option value="pie">Pie Chart</option>
      </optgroup>
    </select>

    <div class="spacer"></div>

    <!-- Theme -->
    <button class="ibtn" id="themeBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <span id="themeLabel">Oscuro</span>
    </button>

    <!-- Save .mmd -->
    <button class="ibtn" id="saveBtn" title="Guardar como archivo .mmd">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
      </svg>
      <span>Guardar .mmd</span>
    </button>

    <!-- Export -->
    <div class="dd-wrap">
      <button class="ibtn primary" id="exportBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Exportar</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dd-menu" id="exportMenu">
        <div class="dd-group-label">Imagen</div>
        <div class="dd-item" id="doExportSVG">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8.5 15.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM15.5 9h-1.75L12 15l-1.75-4.5H8.5"/></svg>
          Exportar como SVG
        </div>
        <div class="dd-item" id="doExportPNG">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Exportar como PNG
        </div>
        <div class="dd-sep"></div>
        <div class="dd-group-label">Código</div>
        <div class="dd-item" id="doCopyCode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copiar código
        </div>
      </div>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div id="workspace">

    <!-- Editor -->
    <div id="editor-pane">
      <div class="pane-header">
        <span class="pane-title">Editor</span>
        <span class="pane-badge badge-mono">Mermaid</span>
      </div>
      <textarea id="editor" spellcheck="false"
        placeholder="Escribe código Mermaid aquí…

Ejemplo:
flowchart TD
    A[Inicio] --> B{¿Condición?}
    B -->|Sí| C[Proceso]
    B -->|No| D[Fin]
    C --> D"></textarea>
    </div>

    <div id="resizer"></div>

    <!-- Preview -->
    <div id="preview-pane">
      <div class="pane-header">
        <span class="pane-title">Vista Previa</span>
        <span class="pane-badge badge-live">● Live</span>
      </div>
      <div id="canvas">
        <div id="diagram-output"></div>
        <div id="zoom-bar">
          <button class="z-btn" id="zoomOut" title="Alejar">−</button>
          <span id="zoom-label">100%</span>
          <button class="z-btn" id="zoomIn"  title="Acercar">+</button>
          <button class="z-btn" id="zoomReset" title="Restablecer" style="font-size:11px">⊙</button>
        </div>
      </div>
      <div id="statusbar">
        <div class="s-ind">
          <div class="dot idle" id="dot"></div>
          <span id="status-msg">Listo</span>
        </div>
        <div class="sb-r">
          <span id="char-count">0 char</span>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
/* ── TEMPLATES ─────────────────────────────────────── */
const TEMPLATES = {
  flowchart: `flowchart TD
    A([Inicio]) --> B{¿Usuario autenticado?}
    B -->|Sí| C[Cargar Dashboard]
    B -->|No| D[Pantalla de Login]
    D --> E{¿Credenciales válidas?}
    E -->|Sí| C
    E -->|No| F[Mostrar error]
    F --> D
    C --> G([Fin])`,

  sequence: `sequenceDiagram
    actor U as Usuario
    participant F as Frontend
    participant A as API Gateway
    participant DB as Base de Datos
    U->>F: Ingresa credenciales
    F->>A: POST /auth/login
    A->>DB: Validar usuario
    DB-->>A: Datos del usuario
    A-->>F: JWT Token (200 OK)
    F-->>U: Redirige al dashboard`,

  classDiagram: `classDiagram
    class Vehiculo {
        +String marca
        +String modelo
        +int año
        +arrancar() void
        +detener() void
    }
    class Auto {
        +int numeroPuertas
        +abrirMaletero() void
    }
    class Camion {
        +float capacidadCarga
        +cargar(kg float) void
    }
    class Motor {
        +int cilindros
        +float cilindrada
        +encender() bool
    }
    Vehiculo <|-- Auto
    Vehiculo <|-- Camion
    Vehiculo *-- Motor`,

  erDiagram: `erDiagram
    CLIENTE {
        int    id        PK
        string nombre
        string email
    }
    PEDIDO {
        int    id        PK
        date   fecha
        string estado
        float  total
        int    cliente_id FK
    }
    PRODUCTO {
        int    id    PK
        string nombre
        float  precio
        int    stock
    }
    DETALLE_PEDIDO {
        int   pedido_id   FK
        int   producto_id FK
        int   cantidad
        float precio_unit
    }
    CLIENTE     ||--o{ PEDIDO           : realiza
    PEDIDO      ||--|{ DETALLE_PEDIDO   : contiene
    PRODUCTO    ||--o{ DETALLE_PEDIDO   : aparece`,

  gantt: `gantt
    title Plan de Proyecto Q1 2025
    dateFormat  YYYY-MM-DD
    section Diseño
    Investigación UX      :a1, 2025-01-06, 8d
    Wireframes            :a2, after a1, 6d
    Diseño visual         :a3, after a2, 8d
    section Desarrollo
    Arquitectura          :b1, 2025-01-20, 4d
    Frontend              :b2, after b1, 18d
    Backend               :b3, after b1, 18d
    section Cierre
    QA                    :c1, after b2, 6d
    Deploy                :c2, after c1, 2d`,

  stateDiagram: `stateDiagram-v2
    [*] --> Borrador
    Borrador --> EnRevisión : Enviar
    EnRevisión --> Aprobado : Aprobar
    EnRevisión --> Borrador : Rechazar
    Aprobado --> Publicado : Publicar
    Publicado --> Archivado : Archivar
    Archivado --> [*]`,

  journey: `journey
    title Experiencia de compra en línea
    section Descubrimiento
      Busca en Google        : 3 : Cliente
      Ve anuncio             : 4 : Cliente
      Entra al sitio         : 5 : Cliente
    section Evaluación
      Revisa imágenes        : 4 : Cliente
      Lee reseñas            : 3 : Cliente
    section Compra
      Agrega al carrito      : 5 : Cliente
      Completa el checkout   : 2 : Cliente
      Recibe confirmación    : 5 : Cliente`,

  pie: `pie title Tecnologías Backend 2025
    "Node.js"  : 34
    "Python"   : 28
    "Java"     : 18
    "Go"       : 12
    "Otros"    : 8`
};

/* ── STATE ─────────────────────────────────────────── */
let isDark = false;
let zoom   = 1;
let timer  = null;
let ctr    = 0;

const editor    = document.getElementById('editor');
const output    = document.getElementById('diagram-output');
const dot       = document.getElementById('dot');
const statusMsg = document.getElementById('status-msg');
const charCount = document.getElementById('char-count');
const zoomLabel = document.getElementById('zoom-label');

/* ── MERMAID — sin themeVariables para respetar colores nativos ── */
function initMermaid() {
  mermaid.initialize({
    startOnLoad:   false,
    securityLevel: 'loose',
    // ✅ 'default' (claro) o 'dark': colores nativos de la librería
    theme: isDark ? 'dark' : 'default',
    fontFamily: "'IBM Plex Sans', sans-serif",
    flowchart: { curve: 'basis', padding: 20 },
    sequence:  { actorMargin: 70, messageMargin: 30 },
    gantt:     { barHeight: 22, fontSize: 12 },
  });
}
initMermaid();

/* ── RENDER ─────────────────────────────────────────── */
async function render() {
  const code = editor.value.trim();
  charCount.textContent = `${code.length} char`;

  if (!code) {
    output.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M9 9h6M9 12h4"/>
          </svg>
        </div>
        <div>Escribe código Mermaid en el editor</div>
        <div style="font-size:12px;opacity:.6;margin-top:2px">o selecciona una plantilla arriba</div>
      </div>`;
    setStatus('idle', 'Listo');
    return;
  }

  try {
    ctr++;
    const { svg } = await mermaid.render(`mm${ctr}`, code);
    output.innerHTML = svg;
    applyZoom();
    setStatus('ok', 'Diagrama generado');
  } catch (e) {
    const msg = (e.message || 'Sintaxis inválida').split('\n').slice(0,5).join('\n');
    output.innerHTML = `<div class="err-box"><strong>⚠ Error de sintaxis</strong>${esc(msg)}</div>`;
    setStatus('err', 'Error de sintaxis');
  }
}

function schedule() { clearTimeout(timer); timer = setTimeout(render, 380); }
function setStatus(t, msg) {
  statusMsg.textContent = msg;
  dot.className = 'dot ' + (t === 'ok' ? '' : t === 'err' ? 'err' : 'idle');
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

editor.addEventListener('input', schedule);

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    schedule();
  }
});

/* ── TEMPLATES ─────────────────────────────────────── */
document.getElementById('templateSelect').addEventListener('change', function () {
  if (TEMPLATES[this.value]) { editor.value = TEMPLATES[this.value]; render(); }
  this.value = '';
});

/* ── THEME ──────────────────────────────────────────── */
document.getElementById('themeBtn').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeLabel').textContent = isDark ? 'Claro' : 'Oscuro';
  initMermaid();
  render();
});

/* ── ZOOM — sin límite superior ─────────────────────── */
function applyZoom() {
  output.style.transform = `scale(${zoom})`;
  zoomLabel.textContent  = Math.round(zoom * 100) + '%';
}
document.getElementById('zoomIn').addEventListener('click', () => {
  zoom = +(zoom + .15).toFixed(2); applyZoom();   // ✅ sin límite máximo
});
document.getElementById('zoomOut').addEventListener('click', () => {
  zoom = Math.max(.1, +(zoom - .15).toFixed(2)); applyZoom();  // mín 10%
});
document.getElementById('zoomReset').addEventListener('click', () => {
  zoom = 1; applyZoom();
});

/* ── EXPORT DROPDOWN ────────────────────────────────── */
const exportMenu = document.getElementById('exportMenu');
document.getElementById('exportBtn').addEventListener('click', e => {
  e.stopPropagation(); exportMenu.classList.toggle('open');
});
document.addEventListener('click', () => exportMenu.classList.remove('open'));

/* ── TOAST ──────────────────────────────────────────── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

/* ── GUARDAR .MMD ───────────────────────────────────── */
document.getElementById('saveBtn').addEventListener('click', () => {
  const code = editor.value;
  if (!code.trim()) { toast('⚠ El editor está vacío'); return; }
  const date  = new Date().toISOString().slice(0,10);
  const fname = `diagrama-${date}.mmd`;
  const blob  = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`✓ Guardado como ${fname}`);
});

/* ── EXPORT SVG ─────────────────────────────────────── */
document.getElementById('doExportSVG').addEventListener('click', () => {
  const svg = output.querySelector('svg');
  if (!svg) { toast('⚠ No hay diagrama'); return; }
  const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `diagrama-${new Date().toISOString().slice(0,10)}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✓ SVG exportado');
  exportMenu.classList.remove('open');
});

/* ── EXPORT PNG ─────────────────────────────────────── */
document.getElementById('doExportPNG').addEventListener('click', () => {
  const svg = output.querySelector('svg');
  if (!svg) { toast('⚠ No hay diagrama'); return; }
  const SCALE  = 2.5;
  const box    = svg.getBoundingClientRect();
  const svgStr = new XMLSerializer().serializeToString(svg);
  const blob   = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url    = URL.createObjectURL(blob);
  const img    = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width  = box.width  * SCALE;
    c.height = box.height * SCALE;
    const ctx = c.getContext('2d');
    ctx.fillStyle = isDark ? '#161B27' : '#FFFFFF';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = `diagrama-${new Date().toISOString().slice(0,10)}.png`;
    a.click();
    toast('✓ PNG exportado (2.5×)');
  };
  img.onerror = () => { toast('⚠ Error al generar PNG'); URL.revokeObjectURL(url); };
  img.src = url;
  exportMenu.classList.remove('open');
});

/* ── COPY CODE ──────────────────────────────────────── */
document.getElementById('doCopyCode').addEventListener('click', () => {
  navigator.clipboard.writeText(editor.value)
    .then(() => toast('✓ Código copiado'))
    .catch(() => toast('⚠ No se pudo copiar'));
  exportMenu.classList.remove('open');
});

/* ── RESIZER ────────────────────────────────────────── */
const resizer    = document.getElementById('resizer');
const editorPane = document.getElementById('editor-pane');
let dragging = false, startX, startW;

resizer.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startW = editorPane.offsetWidth;
  resizer.classList.add('active');
  document.body.style.userSelect = 'none';
  document.body.style.cursor     = 'col-resize';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const nw = Math.min(
    editorPane.parentElement.offsetWidth * .75,
    Math.max(220, startW + (e.clientX - startX))
  );
  editorPane.style.width = nw + 'px';
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  resizer.classList.remove('active');
  document.body.style.userSelect = '';
  document.body.style.cursor     = '';
});

/* ── INIT ───────────────────────────────────────────── */
editor.value = TEMPLATES.flowchart;
render();
</script>
</body>
</html>
